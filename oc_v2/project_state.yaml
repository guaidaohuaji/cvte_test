fault_handlers:
  error_handler: "先 __disable_irq(), 再 AppDamper_EmergencyShutdown(), 再 while(1)"
  hardfault: "已接入 EmergencyShutdown (best-effort)"
  memmanage: "已接入 EmergencyShutdown (best-effort)"
  busfault: "已接入 EmergencyShutdown (best-effort)"
  usagefault: "已接入 EmergencyShutdown (best-effort)"
  nmi: "已接入 EmergencyShutdown (best-effort)"
  note: >
    致命异常中的 EmergencyShutdown 属于 best-effort.
    若异常由栈损坏/总线不可访问/代码取指故障引起, 不保证一定能完整执行.
    Cortex-M4 进入异常时不会自动设置 PRIMASK.
    __disable_irq() 由软件显式设置 PRIMASK 阻止普通可屏蔽中断介入.
    NMI 和 HardFault 不受 PRIMASK 屏蔽.
